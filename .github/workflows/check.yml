name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  midi-reach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Every script parses
        run: for f in js/*.js tests/*.mjs; do node --check "$f" || exit 1; done

      # Does what the page sends actually reach the emulated board? openmk drew
      # two wheels that were dropped in silence for the life of the project.
      - name: MIDI reachability
        run: node tests/midi_reach.mjs

      # The check has to be able to fail, or it is not a check. Put the bug
      # back and require a red run.
      - name: The check can fail
        run: |
          cp js/main.js /tmp/main.bak
          sed -i 's|function noteOn(n, v = 100) {|function noteOn(n, v = 100) {\n  sendMidi(0xE0, 0, 64);|' js/main.js
          if node tests/midi_reach.mjs; then
            echo "::error::reachability test passed with pitch bend reintroduced; it is vacuous"
            cp /tmp/main.bak js/main.js
            exit 1
          fi
          cp /tmp/main.bak js/main.js
          echo "the test goes red on the original bug, as it must"

      # One key, one note; Space is the damper whatever has focus.
      - name: Computer keys and space bar
        run: node tests/page_input.mjs

      # The tuning knob is varispeed on the board's output. This drives the real
      # process() with a stub that streams a clean 1 kHz tone, and measures the
      # pitch that comes out.
      - name: The tuning knob tunes
        run: node tests/tune.mjs

      # And it has to be able to fail. Take the multiplier out of the ratio, on a
      # copy so the checkout stays clean, and require a red run.
      - name: The tuning check can fail
        run: |
          cp js/ep-processor.js /tmp/ep-mutant.js
          sed -i 's|(this.srcRate / sampleRate) \* this.tuneMul|(this.srcRate / sampleRate)|' /tmp/ep-mutant.js
          if cmp -s js/ep-processor.js /tmp/ep-mutant.js; then
            echo "::error::the mutation did not apply, so this step proves nothing"
            exit 1
          fi
          if node tests/tune.mjs /tmp/ep-mutant.js; then
            echo "::error::tuning test passed with the knob wired to nothing; it is vacuous"
            exit 1
          fi
          echo "the test goes red when the knob does nothing, as it must"

      - name: No stale ROM fetch
        run: |
          if grep -rn 'githubusercontent\|rdpiano/master/roms' js/ index.html; then
            echo "::error::the page fetches ROM data; it must ask the user for it"
            exit 1
          fi
          echo "no remote ROM fetch"
